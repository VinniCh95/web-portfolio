<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vinni did it!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    
    <style>
        :root {
            --bg: #ffffff; 
            --text: #121212; 
            --accent: #f4f4f4;
            --cursor-base: #121212;
            --cursor-hover: rgba(18, 18, 18, 0.1); /* Color suave en hover */
            --transition: cubic-bezier(0.23, 1, 0.32, 1);
            text-transform: lowercase;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --text: #ffffff;
                --accent: #1a1a1a;
                --cursor-base: #ffffff;
                --cursor-hover: rgba(255, 255, 255, 0.15);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* --- NUEVO CURSOR REFINADO --- */
        #cursor-follower {
            position: fixed;
            width: 12px;
            height: 12px;
            background-color: var(--cursor-base);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999999;
            transform: translate(-50%, -50%);
            transition: width 0.3s var(--transition), height 0.3s var(--transition), background-color 0.3s ease;
        }

        /* Clase que aplicaremos con JS cuando el cursor esté sobre un link */
        #cursor-follower.hovering {
            width: 60px;
            height: 60px;
            background-color: var(--cursor-hover);
            border: 1px solid var(--cursor-base);
        }

        /* --- NAVEGACIÓN --- */
        nav {
            display: flex; justify-content: space-between; padding: 1.5rem 5%;
            position: fixed; width: 100%; z-index: 10000;
            background-color: var(--bg); opacity: 0; transform: translateY(-100%); 
            transition: 0.5s var(--transition);
        }
        nav.visible { opacity: 1; transform: translateY(0); }
        nav a { color: var(--text); text-decoration: none; font-size: 0.7rem; text-transform: lowercase; letter-spacing: 2px; font-weight: 600; margin-left: 20px; }

        /* --- HEADER --- */
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 5%; text-align: center; }
        .typewriter-container { font-size: clamp(2.5rem, 8vw, 6rem); font-weight: 300; letter-spacing: -3px; line-height: 1; }
        .sub-header { color: #888; font-weight: 400; margin-top: 20px; display: block; font-size: 5rem; text-align: center;}

        /* --- GRID --- */
        .work { padding: 10rem 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 3rem; }
        .project-card { background: var(--accent); padding: 10px; transition: 0.5s var(--transition); }
        .img-wrap { width: 100%; aspect-ratio: 16/10; overflow: hidden; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.8s; }
        .project-card:hover img { filter: grayscale(0%); transform: scale(1.05); }

        /* --- MODAL --- */
        #project-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 100000; display: none;
            overflow-y: auto; padding: 10vh 10%;
        }
        .modal-content img { width: 100%; margin-top: 2rem; display: block; }
        .close-modal { position: fixed; top: 30px; right: 5%; font-size: 3rem; font-weight: 200; z-index: 100001; }

        /* --- CONTACTO --- */
        .contact { padding: 10rem 5%; background: var(--accent); text-align: center; }
        form { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        input, textarea { padding: 1rem; border: none; border-bottom: 1px solid #888; background: transparent; color: var(--text); font-family: inherit; outline: none; }
        button { padding: 1.2rem; background: var(--text); color: var(--bg); border: none; font-weight: 600; text-transform: lowercase; }
        .social-links { margin-top: 3rem; display: flex; justify-content: center; gap: 2rem; }
        .social-links a { color: var(--text); font-size: 1.2rem; }

        @media (max-width: 768px) { * { cursor: auto !important; } #cursor-follower { display: none; } }
    </style>
</head>
<body>

    <div id="cursor-follower"></div>

    <nav id="main-nav">
        <div class="logo">vinni did it!</div>
        <div>
            <a href="#work">projects</a>
            <a href="#contact">contact</a>
        </div>
    </nav>

    <header id="hero">
        <div class="typewriter-container">
            <span id="typewriter"></span><br>
            <span class="sub-header">vinni did it!</span>
        </div>
    </header>

    <section id="work" class="work">
        <div class="grid">
            <div class="project-card" data-title="Editorial Concept" data-desc="Minimalismo aplicado al papel." data-images='["https://picsum.photos/id/20/1200/800", "https://picsum.photos/id/24/1200/800"]'>
                <div class="img-wrap"><img src="https://picsum.photos/id/20/1200/800"></div>
                <div style="margin-top:1rem; display:flex; justify-content:space-between; font-size:0.8rem"><span>Editorial</span><span>2024</span></div>
            </div>
            <div class="project-card" data-title="Visual Identity" data-desc="Sistemas visuales reactivos." data-images='["https://picsum.photos/id/36/1200/800", "https://picsum.photos/id/48/1200/800"]'>
                <div class="img-wrap"><img src="https://picsum.photos/id/36/1200/800"></div>
                <div style="margin-top:1rem; display:flex; justify-content:space-between; font-size:0.8rem"><span>Branding</span><span>2025</span></div>
            </div>
            <div class="project-card" data-title="Visual Identity" data-desc="Sistemas visuales reactivos." data-images='["https://picsum.photos/id/36/1200/800", "https://picsum.photos/id/48/1200/800"]'>
                <div class="img-wrap"><img src="https://picsum.photos/id/36/1200/800"></div>
                <div style="margin-top:1rem; display:flex; justify-content:space-between; font-size:0.8rem"><span>Branding</span><span>2025</span></div>
            </div>
            <div class="project-card" data-title="Visual Identity" data-desc="Sistemas visuales reactivos." data-images='["https://picsum.photos/id/36/1200/800", "https://picsum.photos/id/48/1200/800"]'>
                <div class="img-wrap"><img src="https://picsum.photos/id/36/1200/800"></div>
                <div style="margin-top:1rem; display:flex; justify-content:space-between; font-size:0.8rem"><span>Branding</span><span>2025</span></div>
            </div>
        </div>
    </section>

    <div id="project-modal">
        <div class="close-modal">&times;</div>
        <div class="modal-content">
            <h1 id="modal-title"></h1>
            <p id="modal-desc" style="color: #888; margin-top: 1rem;"></p>
            <div id="modal-images"></div>
        </div>
    </div>

    <footer id="contact" class="contact">
        <h2>let's talk.</h2>
        <form action="#">
            <input type="text" placeholder="name" required>
            <input type="email" placeholder="email" required>
            <textarea rows="4" placeholder="your ideas"></textarea>
            <button type="submit">send</button>
        </form>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-behance"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
    </footer>

    <script>
    const cursor = document.getElementById('cursor-follower');
    const textElement = document.getElementById('typewriter');
    const modal = document.getElementById('project-modal');
    const nav = document.getElementById('main-nav');

    // Movimiento del cursor
    window.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    // Lógica de Hover para el cursor
    function handleHoverIn() { cursor.classList.add('hovering'); }
    function handleHoverOut() { cursor.classList.remove('hovering'); }

    function refreshInteractiveListeners() {
        document.querySelectorAll('a, button, input, textarea, .project-card, .close-modal').forEach(el => {
            el.addEventListener('mouseenter', handleHoverIn);
            el.addEventListener('mouseleave', handleHoverOut);
        });
    }
    refreshInteractiveListeners();

    // --- NUEVA FUNCIÓN PARA CERRAR EL MODAL ---
    function closeProject() {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
        // Quitamos el estado de hover del cursor por si acaso se quedó pegado al botón de cerrar
        handleHoverOut();
    }

    // --- ESCUCHAR LA TECLA ESCAPE ---
    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape") {
            closeProject();
        }
    });

    // Typewriter
    const phrases = ["Who did it?", "Who design it?", "Who took these photos?", "Who picked those colours?"];
    let pIdx = 0, cIdx = 0, isDeleting = false;

    function type() {
        const current = phrases[pIdx];
        textElement.textContent = isDeleting ? current.substring(0, cIdx - 1) : current.substring(0, cIdx + 1);
        cIdx = isDeleting ? cIdx - 1 : cIdx + 1;
        let speed = isDeleting ? 40 : 100;
        if (!isDeleting && cIdx === current.length) { isDeleting = true; speed = 2000; }
        else if (isDeleting && cIdx === 0) { isDeleting = false; pIdx = (pIdx + 1) % phrases.length; speed = 500; }
        setTimeout(type, speed);
    }
    type();

    // Modal de proyectos
    document.querySelectorAll('.project-card').forEach(card => {
        card.addEventListener('click', () => {
            document.getElementById('modal-title').innerText = card.dataset.title;
            document.getElementById('modal-desc').innerText = card.dataset.desc;
            const container = document.getElementById('modal-images');
            container.innerHTML = '';
            JSON.parse(card.dataset.images).forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                container.appendChild(img);
            });
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        });
    });

    // El botón de cierre ahora usa la función centralizada
    document.querySelector('.close-modal').addEventListener('click', closeProject);

    // Nav y AFK
    let idleTimer;
    window.addEventListener('scroll', () => {
        if (window.scrollY > window.innerHeight * 0.7) nav.classList.add('visible');
        else nav.classList.remove('visible');
        
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            if(window.scrollY > 500 && modal.style.display !== 'block') {
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }, 30000);
    });
</script>
</body>
</html>
